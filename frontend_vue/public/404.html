<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PGU/TUB</title>
    <script>
      // GitHub Pages SPA redirect: preserva o path e redireciona para index.html
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) +
        (l.hash || '')
      );
    </script>
  </head>
  <body>A carregar...</body>
</html>
