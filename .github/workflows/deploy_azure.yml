name: Deploy PGU to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # --- JOB 1: Backend Java ---
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: ./backend_java

      - name: Deploy to Azure Web App (Backend)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'backend-pgu-tub-2026'
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: ./backend_java/target/app.jar

  # --- JOB 2: Frontend Vue ---
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend_vue/package-lock.json'

      - name: Build Frontend
        run: |
          npm install
          npm run build
        working-directory: ./frontend_vue

      - name: Prepare Frontend Bundle
        run: |
          mkdir deploy_bundle
          cp -r frontend_vue/dist deploy_bundle/
          cp frontend_vue/server.js deploy_bundle/
          cp frontend_vue/package.json deploy_bundle/
          # Remover devDependencies de forma mais segura para evitar JSON inválido
          node -e "let j=require('./deploy_bundle/package.json'); delete j.devDependencies; require('fs').writeFileSync('./deploy_bundle/package.json', JSON.stringify(j, null, 2))"

      - name: Deploy to Azure Web App (Frontend)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pgu-tub-frontend-2026'
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: ./deploy_bundle
