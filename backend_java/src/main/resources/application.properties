# Configuração da Base de Dados (Spring Boot Native)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:tub}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:tub_user}
spring.datasource.password=${DB_PASS:tub_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1200000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:10000}

# Configuração de Logs
logging.level.org.springframework.web=INFO
logging.level.pt.uminho.dai.pgu=DEBUG

# Servidor
server.port=8080

# Segurança — não expor detalhes internos em respostas de erro
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
