# Configuração da Base de Dados (Spring Boot Native)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:tub}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração de Logs
logging.level.org.springframework.web=INFO
logging.level.pt.uminho.dai.pgu=DEBUG

# Servidor
server.port=8080
server.error.include-message=always

# ===================================================================
# HARDENING DO HIKARI CONNECTION POOL (PROTEÇÃO CONTRA AVALANCHES)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=PGU-TUB-HikariPool

# ===================================================================
# ATIVAÇÃO DO CACHING DO SPRING BOOT (EXPIRAÇÃO EM TEMPO REAL - 10s)
# ===================================================================
spring.cache.type=caffeine
spring.cache.cache-names=dashboardCache,linhasCache
spring.cache.caffeine.spec=expireAfterWrite=10s,initialCapacity=50,maximumSize=500

